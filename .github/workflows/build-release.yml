name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Must run before the version rewrite: npm ci requires package.json and
      # package-lock.json to agree, and the rewrite touches both.
      - name: Install npm dependencies
        run: npm ci

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_NAME=FlipperClipper v$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          # The tag is the authority: a build whose package.json disagrees keeps
          # being offered its own release as an update.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version is now: $(node scripts/vernum.mjs --raw)"

      - name: Stamp the build with its commit and run
        run: node scripts/build_info.mjs

      # npx, not `npm run tauri build -- --no-bundle`: npm swallows the flag and
      # Tauri bundles anyway. Leaves src-tauri\target\release\flipperclipper.exe.
      - name: Build the app
        run: npx tauri build --no-bundle

      - name: Derive numeric version for the installer
        id: vernum
        shell: bash
        run: |
          VERNUM=$(node scripts/vernum.mjs)
          echo "VERNUM=$VERNUM" >> $GITHUB_OUTPUT
          echo "numeric version: $VERNUM"

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            # winget installs Inno per-user, outside both Program Files roots.
            $globs = @("${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this runner - installing it."
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe still not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          # Via GITHUB_ENV because a fresh choco shim is invisible to this step.
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.version.outputs.VERSION }}" "/DVersionNumeric=${{ steps.vernum.outputs.VERNUM }}" installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.RELEASE_NAME }}
          body: |
            ## ${{ steps.version.outputs.RELEASE_NAME }}

            Trim, crop, speed up, slow down, reverse or re-volume a clip, then
            export it as a video, a GIF, or just the audio — for when a clip
            needs one quick edit before it goes to someone.

            ### Installation
            **`FlipperClipper-Setup.exe`** is the one you want. It installs for
            you alone, asks for no admin rights, and starts the app when it's
            done.

            FlipperClipper uses **FFmpeg** to export. If it isn't on your PATH
            the app offers a one-click install on first launch
            (`winget install -e --id Gyan.FFmpeg`).

            ### Already have FlipperClipper?
            Run `FlipperClipper-Setup.exe` over the top — it keeps your install
            location and shortcut choice. Or just let the app update itself:
            it checks for new releases on launch.
          files: dist_installer/FlipperClipper-Setup.exe
          # Without this a missing installer publishes a green, assetless release
          # that the updater silently skips.
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

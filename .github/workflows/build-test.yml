name: Build Test

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Build name suffix (e.g., crop-handles)'
        required: false
        default: 'test'
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # upload-artifact rejects names containing / \ : < > | * ? " or newline, and
      # feature/** invites nested branch names. The input arrives via env: so free
      # text containing quotes or $(...) cannot run on the runner.
      - name: Get build name
        id: build_name
        shell: bash
        env:
          INPUT_BUILD_NAME: ${{ github.event.inputs.build_name }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            RAW_NAME="$INPUT_BUILD_NAME"
          else
            RAW_NAME=${GITHUB_REF#refs/heads/}
            RAW_NAME=${RAW_NAME#feature/}
            RAW_NAME=${RAW_NAME#bugfix/}
          fi
          SAFE_NAME=${RAW_NAME//[^A-Za-z0-9._-]/-}
          echo "NAME=${SAFE_NAME}" >> $GITHUB_OUTPUT
          echo "artifact name suffix: $SAFE_NAME"

      # No version rewrite, unlike the release workflow: there is no tag to take
      # one from. build-info.json's commit is what tells two test builds apart.
      - name: Stamp the build with its commit and run
        run: node scripts/build_info.mjs

      # npx, not `npm run tauri build -- --no-bundle`: npm swallows the flag.
      - name: Build the app
        run: npx tauri build --no-bundle

      - name: Derive numeric version for the installer
        id: vernum
        shell: bash
        run: |
          VERNUM=$(node scripts/vernum.mjs)
          VERSION=$(node scripts/vernum.mjs --raw)
          echo "VERNUM=$VERNUM" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "version: $VERSION ($VERNUM)"

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          function Find-Iscc {
            $onPath = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if ($onPath) { return $onPath }
            # winget installs Inno per-user, outside both Program Files roots.
            $globs = @("${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup *\ISCC.exe")
            return (Get-ChildItem -Path $globs -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found on this runner - installing it."
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe still not found after installing Inno Setup" }
          Write-Host "Using $iscc"
          # Via GITHUB_ENV because a fresh choco shim is invisible to this step.
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC=$iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=${{ steps.vernum.outputs.VERSION }}" "/DVersionNumeric=${{ steps.vernum.outputs.VERNUM }}" installer.iss

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlipperClipper-Setup_${{ steps.build_name.outputs.NAME }}
          path: dist_installer/FlipperClipper-Setup.exe
          retention-days: 30

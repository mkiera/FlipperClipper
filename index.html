<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlipperClipper</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <div id="banners"></div>

      <section id="stage">
        <video id="video" playsinline preload="auto"></video>

        <div id="empty">
          <div class="wordmark-row">
            <span class="wordmark-seal" aria-hidden="true">🦭</span>
            <h1 class="wordmark">FlipperClipper</h1>
          </div>
          <p class="tagline">A Video Trimmer &amp; Converter</p>

          <p id="about" class="about" hidden></p>

          <p class="empty-title">Drop a video or press Ctrl+O</p>
          <button id="empty-open" class="btn" type="button">Choose file</button>
        </div>

        <div id="crop-layer" hidden>
          <div id="crop-rect">
            <span class="ch ch-nw" data-handle="nw"></span>
            <span class="ch ch-n" data-handle="n"></span>
            <span class="ch ch-ne" data-handle="ne"></span>
            <span class="ch ch-e" data-handle="e"></span>
            <span class="ch ch-se" data-handle="se"></span>
            <span class="ch ch-s" data-handle="s"></span>
            <span class="ch ch-sw" data-handle="sw"></span>
            <span class="ch ch-w" data-handle="w"></span>
          </div>

          <div id="crop-bar">
            <div class="chips" id="crop-aspects"></div>
            <span class="crop-size" id="crop-size"></span>
            <button id="crop-reset" class="btn" type="button">Reset</button>
            <button id="crop-cancel" class="btn" type="button">Cancel</button>
            <button id="crop-done" class="btn primary" type="button">Done</button>
          </div>
        </div>

        <div id="toast" hidden>
          <span id="toast-msg"></span>
          <div id="toast-actions"></div>
          <button id="toast-close" class="icon-btn small" type="button" aria-label="Dismiss">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.4 3.3 3.6 3.6 3.6-3.6 1.1 1.1L9.1 8l3.6 3.6-1.1 1.1L8 9.1l-3.6 3.6-1.1-1.1L6.9 8 3.3 4.4z" /></svg>
          </button>
        </div>
      </section>

      <div id="controls">
        <button id="open-btn" class="icon-btn" type="button" title="Open a video (Ctrl+O)" aria-label="Open a video">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3A1.5 1.5 0 0 1 3 1.5h3.2l1.5 1.7H13A1.5 1.5 0 0 1 14.5 4.7v.8H4.1a1.5 1.5 0 0 0-1.44 1.07L1.5 10.5zm.4 9.5 1.35-4.6a.7.7 0 0 1 .67-.5h10.9a.7.7 0 0 1 .67.9l-1.13 3.85a1.5 1.5 0 0 1-1.44 1.08H3a1.5 1.5 0 0 1-1.1-.73z" /></svg>
        </button>

        <button id="play-btn" class="icon-btn" type="button" title="Play / pause (Space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" /></svg>
        </button>

        <div id="time" class="time">0:00.0 / 0:00.0</div>

        <div class="slider-group" title="Playback and export speed">
          <!-- Slider units are log2(speed): -2..3 = 0.25x..8x. controls.ts converts both ways. -->
          <input id="speed-slider" type="range" min="-2" max="3" step="0.001" value="0" list="speed-notches" aria-label="Speed" />
          <datalist id="speed-notches">
            <option value="-2" label="0.25x"></option>
            <option value="-1"></option>
            <option value="0" label="1x"></option>
            <!-- Must satisfy the slider's step from min or Chromium drops the tick entirely. -->
            <option value="0.585"></option>
            <option value="1"></option>
            <option value="2"></option>
            <option value="3" label="8x"></option>
          </datalist>
          <input id="speed-input" type="number" min="0.05" max="20" step="0.01" value="1" aria-label="Speed multiplier" />
        </div>

        <button id="reverse-btn" class="icon-btn" type="button" title="Reverse (R)" aria-label="Reverse">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3V.8L4.2 3.9 8 7V4.5a3.9 3.9 0 1 1-3.9 4.4l-1.5.2A5.4 5.4 0 1 0 8 3z" /></svg>
        </button>

        <button id="mute-btn" class="icon-btn" type="button" title="Mute (M)" aria-label="Mute">
          <svg class="i-sound" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 4.5 5H2v6h2.5L8 14zM10.5 5.4a3.6 3.6 0 0 1 0 5.2l1 1a5 5 0 0 0 0-7.2z" /></svg>
          <svg class="i-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 4.5 5H2v6h2.5L8 14zM10.6 6.2 12 7.6l1.4-1.4 1 1L13 8.6l1.4 1.4-1 1L12 9.6l-1.4 1.4-1-1L11 8.6 9.6 7.2z" /></svg>
        </button>

        <div class="slider-group" id="volume-group" title="Volume. Above 100% boost applies to the exported clip; the preview tops out at 100%.">
          <input id="volume-slider" type="range" min="0" max="200" step="1" value="100" list="volume-notches" aria-label="Volume" />
          <datalist id="volume-notches">
            <option value="100" label="100%"></option>
          </datalist>
          <span id="volume-readout" class="readout">100%</span>
        </div>

        <button id="crop-btn" class="btn" type="button" title="Crop (C)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 1v10.5H15v1.5H4.5V15H3v-2h-2v-1.5h2V1zM6 3h6.5v8.5H11V4.5H6z" /></svg>
          <span class="btn-label">Crop</span>
        </button>

        <div class="spacer"></div>

        <button id="audio-only-btn" class="icon-btn" type="button" title="Audio only" aria-label="Audio only">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 1 5 2.7v8a2.4 2.4 0 1 0 1.5 2.2V6.3l5.5-1.1v4.2a2.4 2.4 0 1 0 1.5 2.2z" /></svg>
        </button>

        <select id="format-select" title="Export format"></select>

        <select id="quality-select" title="Export quality">
          <option value="high">High</option>
          <option value="balanced">Balanced</option>
          <option value="small">Small</option>
          <option value="fit">Fit under…</option>
        </select>

        <input id="fit-mb" type="number" min="0.5" max="10000" step="0.5" value="10" list="fit-mb-sizes" title="Target size in MB" aria-label="Target size in MB" hidden />
        <datalist id="fit-mb-sizes">
          <option value="10"></option>
          <option value="25"></option>
          <option value="50"></option>
          <option value="100"></option>
        </datalist>

        <div id="export-area">
          <button id="export-btn" class="btn primary" type="button" title="Export (Ctrl+E)">Export</button>

          <div id="export-running" hidden>
            <div class="bar"><div class="bar-fill" id="export-fill"></div></div>
            <span class="bar-text" id="export-text">0%</span>
            <button id="export-cancel" class="icon-btn small" type="button" title="Cancel export" aria-label="Cancel export">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.4 3.3 3.6 3.6 3.6-3.6 1.1 1.1L9.1 8l3.6 3.6-1.1 1.1L8 9.1l-3.6 3.6-1.1-1.1L6.9 8 3.3 4.4z" /></svg>
            </button>
          </div>

          <div id="export-popover" hidden>
            <label class="check">
              <input type="checkbox" id="lossless" />
              <span>Lossless (instant, cuts snap to keyframes)</span>
            </label>
            <div class="popover-actions">
              <button id="popover-cancel" class="btn" type="button">Cancel</button>
              <button id="popover-go" class="btn primary" type="button">Export</button>
            </div>
          </div>
        </div>
      </div>

      <div id="timeline">
        <div id="tl-scroll">
          <div id="tl-track">
            <div id="tl-strip"></div>
            <div class="tl-shade" id="tl-shade-left"></div>
            <div class="tl-shade" id="tl-shade-right"></div>
            <div class="tl-handle" id="tl-in" title="Trim start (I)"><i></i></div>
            <div class="tl-handle" id="tl-out" title="Trim end (O)"><i></i></div>
            <div id="tl-playhead"></div>
          </div>
        </div>

        <div class="tl-zoom">
          <button id="tl-zoom-out" class="icon-btn small" type="button" title="Zoom out" aria-label="Zoom out">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7.25h12v1.5H2z" /></svg>
          </button>
          <button id="tl-zoom-in" class="icon-btn small" type="button" title="Zoom in" aria-label="Zoom in">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.25 2h1.5v5.25H14v1.5H8.75V14h-1.5V8.75H2v-1.5h5.25z" /></svg>
          </button>
          <button id="tl-zoom-fit" class="icon-btn small" type="button" title="Fit whole clip" aria-label="Fit whole clip">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5v-3h3V3H3v1.5zM11.5 1.5h3v3H13V3h-1.5zM3 11.5v1.5h1.5v1.5h-3v-3zM13 11.5h1.5v3h-3V13H13zM4.5 5.5h7v5h-7z" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="drop-hint" hidden><span>Drop to open</span></div>
  </body>
</html>

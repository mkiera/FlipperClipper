<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickClip</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <!--
        Banners are created and removed by controls.ts rather than being spelled
        out here: two of them can be up at once (FFmpeg missing plus a preview
        that will not decode) and they must stack without either one owning a
        fixed slot in the layout.
      -->
      <div id="banners"></div>

      <section id="stage">
        <video id="video" playsinline preload="auto"></video>

        <div id="empty">
          <p class="empty-title">Drop a video or press Ctrl+O</p>
          <button id="empty-open" class="btn" type="button">Choose file</button>

          <!--
            The build identity, filled in by main.ts and left hidden if it
            cannot be worked out. It sits here rather than behind a menu
            because this is the only screen with room going spare, and nobody
            asks which build they are running while they are mid-cut.
          -->
          <p id="about" class="about" hidden></p>
        </div>

        <div id="crop-layer" hidden>
          <div id="crop-rect">
            <span class="ch ch-nw" data-handle="nw"></span>
            <span class="ch ch-n" data-handle="n"></span>
            <span class="ch ch-ne" data-handle="ne"></span>
            <span class="ch ch-e" data-handle="e"></span>
            <span class="ch ch-se" data-handle="se"></span>
            <span class="ch ch-s" data-handle="s"></span>
            <span class="ch ch-sw" data-handle="sw"></span>
            <span class="ch ch-w" data-handle="w"></span>
          </div>

          <div id="crop-bar">
            <div class="chips" id="crop-aspects"></div>
            <span class="crop-size" id="crop-size"></span>
            <button id="crop-reset" class="btn" type="button">Reset</button>
            <button id="crop-cancel" class="btn" type="button">Cancel</button>
            <button id="crop-done" class="btn primary" type="button">Done</button>
          </div>
        </div>
      </section>

      <div id="controls">
        <button id="play" class="icon-btn" type="button" title="Play / pause (Space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
          <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" /></svg>
        </button>

        <div id="time" class="time">0:00.0 / 0:00.0</div>

        <div class="chips" id="speed-chips"></div>

        <button id="crop-btn" class="btn" type="button" title="Crop (C)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 1v10.5H15v1.5H4.5V15H3v-2h-2v-1.5h2V1zM6 3h6.5v8.5H11V4.5H6z" /></svg>
          <span class="btn-label">Crop</span>
        </button>

        <button id="mute-btn" class="btn" type="button" title="Mute (M)">
          <svg class="i-sound" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 4.5 5H2v6h2.5L8 14zM10.5 5.4a3.6 3.6 0 0 1 0 5.2l1 1a5 5 0 0 0 0-7.2z" /></svg>
          <svg class="i-muted" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 4.5 5H2v6h2.5L8 14zM10.6 6.2 12 7.6l1.4-1.4 1 1L13 8.6l1.4 1.4-1 1L12 9.6l-1.4 1.4-1-1L11 8.6 9.6 7.2z" /></svg>
          <span class="btn-label">Sound</span>
        </button>

        <div class="spacer"></div>

        <select id="quality" title="Export quality">
          <option value="high">High</option>
          <option value="balanced">Balanced</option>
          <option value="small">Small</option>
          <option value="fit10">Fit 10 MB</option>
          <option value="fit25">Fit 25 MB</option>
        </select>

        <div id="export-area">
          <button id="export-btn" class="btn primary" type="button" title="Export (Ctrl+E)">Export</button>

          <div id="export-running" hidden>
            <div class="bar"><div class="bar-fill" id="export-fill"></div></div>
            <span class="bar-text" id="export-text">0%</span>
            <button id="export-cancel" class="icon-btn small" type="button" title="Cancel export" aria-label="Cancel export">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.4 3.3 3.6 3.6 3.6-3.6 1.1 1.1L9.1 8l3.6 3.6-1.1 1.1L8 9.1l-3.6 3.6-1.1-1.1L6.9 8 3.3 4.4z" /></svg>
            </button>
          </div>

          <div id="export-popover" hidden>
            <label class="check">
              <input type="checkbox" id="lossless" />
              <span>Lossless (instant, cuts snap to keyframes)</span>
            </label>
            <div class="popover-actions">
              <button id="popover-cancel" class="btn" type="button">Cancel</button>
              <button id="popover-go" class="btn primary" type="button">Export</button>
            </div>
          </div>
        </div>
      </div>

      <div id="timeline">
        <div id="tl-track">
          <div id="tl-strip"></div>
          <div class="tl-shade" id="tl-shade-left"></div>
          <div class="tl-shade" id="tl-shade-right"></div>
          <div class="tl-handle" id="tl-in" title="Trim start (I)"><i></i></div>
          <div class="tl-handle" id="tl-out" title="Trim end (O)"><i></i></div>
          <div id="tl-playhead"></div>
        </div>
      </div>
    </div>

    <div id="drop-hint" hidden><span>Drop to open</span></div>

    <div id="toast" hidden>
      <span id="toast-msg"></span>
      <div id="toast-actions"></div>
      <button id="toast-close" class="icon-btn small" type="button" aria-label="Dismiss">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.4 3.3 3.6 3.6 3.6-3.6 1.1 1.1L9.1 8l3.6 3.6-1.1 1.1L8 9.1l-3.6 3.6-1.1-1.1L6.9 8 3.3 4.4z" /></svg>
      </button>
    </div>
  </body>
</html>
